name: Verify Gullak

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Product and update tests
        run: pnpm test
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
      - name: Built Worker checks
        run: pnpm test:worker
